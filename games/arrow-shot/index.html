<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#FFF1F2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="description" content="Pull back. Release. Hit the mark." />
  <title>Arrow Shot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111111'/%3E%3Cpath d='M14 32h32M40 24l10 8-10 8' stroke='%23FB7185' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="topbar" role="banner">
    <a class="topbar-back" href="../../">‹ Games</a>
    <h1 class="topbar-title">Arrow Shot</h1>
    <button type="button" class="topbar-help" id="btn-howto" aria-label="How to play">?</button>
  </header>

  <div id="app">
    <section id="screen-home" class="screen">
      <header class="brand">
        <h2 class="display">Arrow Shot</h2>
        <p class="lede">Pull back. Release. Hit the mark.</p>
        <p class="caption meta-line">1 · ~3 min</p>
      </header>
      <div class="card stack">
        <button type="button" class="btn btn-primary btn-block" id="btn-play">Play</button>
      </div>
    </section>

    <section id="screen-play" class="screen screen-play">
      <div class="play-hud" aria-live="polite">
        <span class="hud-item"><span class="hud-label">Arrows</span> <strong id="hud-arrows">5</strong></span>
        <span class="hud-item"><span class="hud-label">Hits</span> <strong id="hud-hits">0</strong></span>
        <span class="hud-item"><span class="hud-label">Score</span> <strong id="hud-score">0</strong></span>
      </div>
      <div class="stage-wrap">
        <canvas id="stage" width="360" height="520" aria-label="Archery stage — drag to aim, release to shoot"></canvas>
        <div class="feedback" id="feedback" hidden aria-live="assertive"></div>
      </div>
      <p class="hint center" id="play-hint">Drag back to aim · release to shoot</p>
    </section>

    <section id="screen-results" class="screen">
      <header class="brand">
        <h2 class="title">Results</h2>
        <p class="lede caption" id="results-sub">Nice shooting</p>
      </header>
      <div class="card">
        <div class="results-stats" id="results-stats">
          <div class="stat">
            <span class="stat-label">Hits</span>
            <span class="stat-value" id="stat-hits">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Score</span>
            <span class="stat-value accent" id="stat-score">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Arrows</span>
            <span class="stat-value" id="stat-arrows">0 / 5</span>
          </div>
        </div>
        <p class="hint center" id="results-note"></p>
        <div class="stack" style="margin-top:16px">
          <button type="button" class="btn btn-primary btn-block" id="btn-again">Again</button>
          <a class="btn btn-ghost btn-block" href="../../">All games</a>
        </div>
      </div>
    </section>
  </div>

  <div id="howto-overlay" class="sheet-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="howto-title" id="howto-sheet">
      <div class="sheet-header">
        <h2 class="title" id="howto-title">How to play</h2>
        <button type="button" class="sheet-close" id="btn-howto-close" aria-label="Close">✕</button>
      </div>
      <ol class="howto-steps">
        <li>Pull back to aim.</li>
        <li>Release to shoot.</li>
        <li>Hit the targets — 5 arrows.</li>
      </ol>
      <button type="button" class="btn btn-primary btn-block" id="btn-howto-gotit">Got it</button>
    </div>
  </div>

  <script src="../shared/vendor/matter.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
