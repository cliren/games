<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bhakti Bhajans — a simple ad-free playlist player for sacred music." />
  <title>Bhakti Bhajans</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="app">
    <header class="header">
      <div class="lotus" aria-hidden="true">ॐ</div>
      <div>
        <h1>Bhakti Bhajans</h1>
        <p class="tagline">Sacred songs · Ad-free · Offline-ready</p>
      </div>
    </header>

    <section class="now-playing" aria-live="polite">
      <div class="art" id="art">
        <span class="art-glyph" id="artGlyph">♪</span>
      </div>
      <div class="meta">
        <h2 id="trackTitle">Loading…</h2>
        <p id="trackArtist">—</p>
      </div>
    </section>

    <section class="controls" aria-label="Playback controls">
      <div class="seek-row">
        <span id="currentTime" class="time">0:00</span>
        <input
          type="range"
          id="seek"
          class="seek"
          min="0"
          max="1000"
          value="0"
          step="1"
          aria-label="Seek"
        />
        <span id="duration" class="time">0:00</span>
      </div>

      <div class="buttons">
        <button type="button" id="btnPrev" class="btn btn-icon" aria-label="Previous track" title="Previous">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button type="button" id="btnPlay" class="btn btn-play" aria-label="Play" title="Play">
          <svg id="iconPlay" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
          <svg id="iconPause" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
        </button>
        <button type="button" id="btnNext" class="btn btn-icon" aria-label="Next track" title="Next">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.74 2.5-2.26 2.5-4.02z"/></svg>
        <input
          type="range"
          id="volume"
          class="volume"
          min="0"
          max="1"
          step="0.01"
          value="0.9"
          aria-label="Volume"
        />
      </div>
    </section>

    <section class="playlist-section">
      <div class="playlist-header">
        <h3>Playlist</h3>
        <span id="trackCount" class="count"></span>
      </div>
      <ul id="playlist" class="playlist" role="list"></ul>
    </section>

    <footer class="footer">
      <p>Hosted on GitHub Pages · No ads · No tracking</p>
    </footer>
  </main>

  <audio id="audio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
